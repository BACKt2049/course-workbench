name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r sync/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q sync
      - name: Answer center tests
        run: python -m unittest discover -s sync/tests -p test_answers.py -v
      - name: Attachment tests
        run: python -m unittest discover -s sync/tests -p test_attachments.py -v
      - name: Reliability tests
        run: python -m unittest discover -s sync/tests -p test_reliability.py -v
      - name: Task identity and status regressions
        run: python -m unittest discover -s sync/tests -p test_task_sync.py -v
      - name: Course, exam and QR parser regressions
        run: python sync/tests/test_parsers.py
      - name: Frontend sync regressions
        run: node sync/tests/test_task_sync.cjs
